name: ITMOSOFT Commerce Integration Tests
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
jobs:
  integration:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            laravel: '12'
            testbench: '^10.0'
          - php: '8.4'
            laravel: '12'
            testbench: '^10.0'
          - php: '8.3'
            laravel: '13'
            testbench: '^11.0'
          - php: '8.4'
            laravel: '13'
            testbench: '^11.0'
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
      - name: Pin Testbench for Laravel matrix
        run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction
      - name: Validate Composer
        run: composer validate --strict
      - name: Resolve package repositories
        run: composer update --no-interaction --prefer-dist
      - name: Run integration tests
        run: composer test
